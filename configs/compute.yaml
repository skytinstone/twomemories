# Colab compute units per hour by GPU name substring (matched case-insensitively against torch.cuda.get_device_name).
# A100: Colab "Resources" panel rate, 2026-11-07 (Pro+, 80 GB GPU, high-RAM runtime), docs/decision_log.md D-19.
# The other GPU rates are UNVERIFIED placeholders. mps/cpu are local and cost 0.
units_per_hour:
  H100: 15.0
  A100: 8.88
  L4: 4.8
  T4: 1.8
  mps: 0.0
  cpu: 0.0
  default: 11.8
# Total Colab budget for the whole study (single shot), and per-phase caps. run_phase stops a phase at its cap.
total_units: 350
# Caps = about 1.5x the estimate from the 4B preflight (1.47 s/sample, A100 8.88 units/h), counting only cells
# a phase adds (cells shared with an earlier phase are skipped and cost nothing). 9B assumed at most 2.25x the
# 4B time (parameter ratio). docs/decision_log.md D-25.
phase_caps:
  preflight: 15
  phase1_probe: 60    # est 39.2
  phase2_bits: 30     # est 19.6
  phase3_tokens: 25   # est 16.3
  phase4_scale: 70    # est 29-44
  phase5_channels: 15 # est ~9.6 (3 new conditions x 900 samples, 4B), D-27
  core4b: 14          # est ~10.6 (7 cells x 400 samples, 4B, A100), D-33
# Fallback seconds per sample for --dry-run when compute_log has no entry for this model/gpu.
sec_per_sample_guess:
  default: 3.3   # 9B prior: 4B preflight 1.47 s x 2.25
